[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "parityforge"
version = "0.1.0"
description = "Cross-DCC verification of evaluated procedural geometry"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Plygonality" }]
keywords = ["blender", "houdini", "procedural", "geometry", "verification", "parity"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
]
dependencies = [
    "numpy>=1.26",
    "pydantic>=2.5",
    "pyyaml>=6",
    "scipy>=1.11",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
parityforge = "parityforge.cli:main"

[project.urls]
Homepage = "https://github.com/Plygonality/ParityForge"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
parityforge = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 140
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "W"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E402"]
"tools/*" = ["E402"]
