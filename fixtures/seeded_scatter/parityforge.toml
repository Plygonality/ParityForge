schema_version = "1.0.0"
intent = "distribution"

# 5,000 uniform samples on a 10 m square. These are distribution tolerances,
# not vertex tolerances. A 0.4 m centroid bias still fails the 0.25 m gate.
[tolerances.centroid]
absolute = 0.25
relative = 0.0
unit = "meter"
minimum_samples = 1

[tolerances.bounds]
absolute = 0.5
relative = 0.0
unit = "meter"
minimum_samples = 1
